name: archprint check
description: Flag the architecture-rule violations a pull request introduces, with the evidence for each rule.
author: Oluwatomiwa Ajiferuke
branding:
  icon: git-pull-request
  color: blue

inputs:
  path:
    description: App directory to check. Defaults to the app recorded in .archprint/config.json.
    required: false
    default: ''
  working-directory:
    description: Directory that holds .archprint/ (where archprint init or generate was run).
    required: false
    default: '.'
  fail-on:
    description: '"none" (default) only warns; "new" fails the job when the pull request adds a violation.'
    required: false
    default: none
  base:
    description: Branch or commit to compare against. Defaults to the pull request's base commit.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  archprint-version:
    description: archprint version to run (exact, for reproducible results).
    required: false
    default: 0.10.5
  node-version:
    description: Node.js version.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: archprint check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARCHPRINT_VERSION: ${{ inputs.archprint-version }}
        ARCHPRINT_PATH: ${{ inputs.path }}
        ARCHPRINT_BASE: ${{ inputs.base }}
        ARCHPRINT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ -z "$ARCHPRINT_BASE" ]; then
          echo "::error title=archprint::No base to compare against. Run this action on pull_request, or set the base input."
          exit 2
        fi
        set -- check --base "$ARCHPRINT_BASE" --fail-on "$ARCHPRINT_FAIL_ON" --format github
        [ -n "$ARCHPRINT_PATH" ] && set -- "$@" -- "$ARCHPRINT_PATH"
        npx --yes "archprint@$ARCHPRINT_VERSION" "$@"
